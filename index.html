<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Claude App</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --chat-bg: #252538;
            --text-color: #cdd6f4;
            --user-msg: #89b4fa;
            --claude-msg: #45475a;
            --input-bg: #313244;
            --accent: #cba6f7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--chat-bg);
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            border-bottom: 1px solid #45475a;
        }

        .config-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input, select, button {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid #45475a;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        input[type="password"] {
            width: 250px;
        }

        button {
            background-color: var(--accent);
            color: #11111b;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        /* Standard markdown and code layout formatting */
        .message pre {
            background-color: #11111b;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
        }
        .message code {
            font-family: 'Courier New', Courier, monospace;
            background-color: #11111b;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .message pre code {
            background-color: transparent;
            padding: 0;
        }

        .user {
            background-color: var(--user-msg);
            color: #11111b;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .claude {
            background-color: var(--claude-msg);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        #input-container {
            padding: 20px;
            background-color: var(--chat-bg);
            display: flex;
            gap: 10px;
            border-top: 1px solid #45475a;
        }

        textarea {
            flex: 1;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid #45475a;
            padding: 12px;
            border-radius: 8px;
            resize: none;
            height: 24px;
            font-family: inherit;
            font-size: 15px;
        }

        textarea:focus {
            outline: 1px solid var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <div class="config-group">
            <label for="api-key">Claude API Key:</label>
            <input type="password" id="api-key" placeholder="Paste sk-ant-... here">
        </div>
        <div class="config-group">
            <label for="model-select">Model:</label>
            <select id="model-select">
                <option value="claude-sonnet-4-6">Claude Sonnet 4.6 (Recommended)</option>
                <option value="claude-opus-4-7">Claude Opus 4.7</option>
                <option value="claude-haiku-4-5">Claude Haiku 4.5</option>
            </select>
        </div>
        <button id="clear-key-btn" style="background-color: #f38ba8; margin-left: auto;">Forget Key</button>
    </header>

    <div id="chat-container">
        <div class="message claude">Ready to stream. Enter your key and prompt to verify. Large code returns will build out live without timing out.</div>
    </div>

    <div id="input-container">
        <textarea id="user-input" placeholder="Type a message... (Enter to send)"></textarea>
        <button id="send-btn">Send</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const apiKeyInput = document.getElementById('api-key');
        const modelSelect = document.getElementById('model-select');
        const clearKeyBtn = document.getElementById('clear-key-btn');

        if (localStorage.getItem('my_claude_key')) {
            apiKeyInput.value = localStorage.getItem('my_claude_key');
        }

        apiKeyInput.addEventListener('input', () => {
            localStorage.setItem('my_claude_key', apiKeyInput.value.trim());
        });

        clearKeyBtn.addEventListener('click', () => {
            localStorage.removeItem('my_claude_key');
            apiKeyInput.value = '';
            alert('API key cleared.');
        });

        let conversationHistory = [];

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            if (sender === 'claude') {
                msgDiv.innerHTML = marked.parse(text);
            } else {
                msgDiv.textContent = text;
            }
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!text) return;
            if (!apiKey) {
                alert('Please configure your API key.');
                return;
            }

            userInput.value = '';
            appendMessage(text, 'user');
            conversationHistory.push({ role: 'user', content: text });

            const claudeMessageDiv = document.createElement('div');
            claudeMessageDiv.classList.add('message', 'claude');
            claudeMessageDiv.textContent = 'Thinking...';
            chatContainer.appendChild(claudeMessageDiv);

            const apiUrl = 'https://api.anthropic.com/v1/messages';

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01',
                        'content-type': 'application/json',
                        'anthropic-dangerous-direct-browser-access': 'true' 
                    },
                    body: JSON.stringify({
                        model: modelSelect.value,
                        max_tokens: 4000,
                        messages: conversationHistory,
                        stream: true
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `HTTP ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullReply = '';
                claudeMessageDiv.textContent = ''; 

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data:')) {
                            try {
                                const parsed = JSON.parse(line.substring(5));
                                if (parsed.type === 'content_block_delta' && parsed.delta?.text) {
                                    fullReply += parsed.delta.text;
                                    claudeMessageDiv.innerHTML = marked.parse(fullReply);
                                    chatContainer.scrollTop = chatContainer.scrollHeight;
                                }
                            } catch (e) {
                                // Gracefully capture unfinished chunks
                            }
                        }
                    }
                }

                conversationHistory.push({ role: 'assistant', content: fullReply });

            } catch (error) {
                console.error(error);
                claudeMessageDiv.textContent = `System Error: ${error.message}`;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
