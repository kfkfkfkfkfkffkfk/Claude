<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Custom Claude Client</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --chat-bg: #252538;
            --text-color: #cdd6f4;
            --user-msg: #89b4fa;
            --claude-msg: #45475a;
            --input-bg: #313244;
            --accent: #cba6f7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--chat-bg);
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid #45475a;
        }

        .config-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input, select, button {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid #45475a;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        input[type="password"] {
            width: 250px;
        }

        button {
            background-color: var(--accent);
            color: #11111b;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user {
            background-color: var(--user-msg);
            color: #11111b;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .claude {
            background-color: var(--claude-msg);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .system-status {
            align-self: center;
            font-size: 12px;
            color: #a6adc8;
            font-style: italic;
        }

        #input-container {
            padding: 20px;
            background-color: var(--chat-bg);
            display: flex;
            gap: 10px;
            border-top: 1px solid #45475a;
        }

        textarea {
            flex: 1;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid #45475a;
            padding: 12px;
            border-radius: 8px;
            resize: none;
            height: 24px;
            font-family: inherit;
            font-size: 15px;
        }

        textarea:focus {
            outline: 1px solid var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <div class="config-group">
            <label for="api-key">API Key:</label>
            <input type="password" id="api-key" placeholder="sk-ant-...">
        </div>
        <div class="config-group">
            <label for="model-select">Model:</label>
            <select id="model-select">
                <option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet</option>
                <option value="claude-3-5-haiku-20241022">Claude 3.5 Haiku</option>
                <option value="claude-3-opus-20240229">Claude 3 Opus</option>
            </select>
        </div>
    </header>

    <div id="chat-container">
        <div class="message claude">Hello! I am your custom Claude interface. Paste your API key above to start talking to me.</div>
    </div>

    <div id="input-container">
        <textarea id="user-input" placeholder="Type your message here... (Press Enter to send, Shift+Enter for new line)"></textarea>
        <button id="send-btn">Send</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const apiKeyInput = document.getElementById('api-key');
        const modelSelect = document.getElementById('model-select');

        // Load saved API key from local storage if it exists
        if (localStorage.getItem('claude_api_key')) {
            apiKeyInput.value = localStorage.getItem('claude_api_key');
        }

        // Save API key when changed
        apiKeyInput.addEventListener('change', () => {
            localStorage.setItem('claude_api_key', apiKeyInput.value);
        });

        // Store conversation history
        let conversationHistory = [];

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!text) return;
            if (!apiKey) {
                alert('Please enter your Anthropic API key first.');
                return;
            }

            // Clear input and append user message
            userInput.value = '';
            appendMessage(text, 'user');
            conversationHistory.push({ role: 'user', content: text });

            // Create a temporary placeholder for Claude's response
            const statusDiv = appendMessage('Claude is thinking...', 'system-status');

            // Using a public CORS proxy to bypass browser restrictions on direct Anthropic API calls
            const proxyUrl = 'https://corsproxy.io/?';
            const apiUrl = 'https://api.anthropic.com/v1/messages';

            try {
                const response = await fetch(proxyUrl + encodeURIComponent(apiUrl), {
                    method: 'POST',
                    headers: {
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01',
                        'content-type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: modelSelect.value,
                        max_tokens: 4000,
                        messages: conversationHistory
                    })
                });

                statusDiv.remove();

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const reply = data.content[0].text;

                // Append Claude's response and save to history
                appendMessage(reply, 'claude');
                conversationHistory.push({ role: 'assistant', content: reply });

            } catch (error) {
                console.error(error);
                statusDiv.remove();
                appendMessage(`Error: ${error.message}. Make sure your API key is valid and you have credits available.`, 'claude');
            }
        }

        // Event Listeners
        sendBtn.addEventListener('click', sendMessage);

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
